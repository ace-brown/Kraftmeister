services:
  frontend:
    build: ./frontend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev
    container_name: frontend
    ports:
      - "3000:3000"
    depends_on:
      - api-gateway
    env_file: .env.dev

  api-gateway:
    build: ./api-gateway
    volumes:
      - ./api-gateway:/app
      - /app/node_modules
    command: npm run start:dev
    container_name: api-gateway
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai-service:
        condition: service_started
    env_file: .env.dev

  ai-service:
    build: ./ai-service
    volumes:
      - ./ai-service:/app
    container_name: ai-service
    ports:
      - "8000:8000"

  postgres:
    image: postgres:16
    volumes:
      - postgres_data:/var/lib/postgresql/data
    container_name: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d kraftmeister"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 30s
    restart: always
    env_file: .env.dev
    ports:
      - "5433:5432"

  redis:
    image: redis:7
    container_name: redis
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 30s
    restart: always
    ports:
      - "6379:6379"

volumes:
  postgres_data:
