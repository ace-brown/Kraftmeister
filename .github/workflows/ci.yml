name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  api-gateway:
    name: API Gateway — type-check & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api-gateway/package-lock.json

      - name: Install dependencies
        working-directory: api-gateway
        run: npm ci

      - name: Type-check
        working-directory: api-gateway
        run: npx tsc --noEmit

      - name: Build
        working-directory: api-gateway
        run: npm run build

  frontend:
    name: Frontend — type-check & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Type-check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Build
        working-directory: frontend
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000

  ai-service:
    name: AI Service — lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        working-directory: ai-service
        run: pip install -r requirements.txt

      - name: Lint with ruff
        working-directory: ai-service
        run: pip install ruff && ruff check .
